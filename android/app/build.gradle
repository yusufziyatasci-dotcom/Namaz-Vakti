plugins { id 'com.android.application' }

def vc = (System.getenv('VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.yusufziyatasci.namazvakti'
    compileSdk 34
    defaultConfig {
        applicationId 'com.yusufziyatasci.namazvakti'
        minSdk 24
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }
    signingConfigs {
        release {
            def ks = System.getenv('KS_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS') ?: 'namaz'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Depoda imza anahtarı tanımlıysa onu, değilse derleme makinesinin anahtarını kullan
            signingConfig System.getenv('KS_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
